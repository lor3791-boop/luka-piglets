<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루카 후기자돈사 전입출 현황판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F0;
    --surface: #FFFFFF;
    --surface-2: #E8EBE3;
    --border: #D8DCD1;
    --text: #1B2320;
    --text-muted: #5C665E;
    --text-faint: #8A9389;
    --accent: #3F6659;
    --accent-strong: #2C4A40;
    --accent-soft: #DCE7DF;
    --in: #2563AA;
    --in-soft: #DCE8F7;
    --out-farm: #B96A1F;
    --out-farm-soft: #F5E3CC;
    --out-ext: #705B87;
    --out-ext-soft: #E9E1EF;
    --danger: #A83636;
    --danger-soft: #F5DEDD;
    --success: #3F7D53;
    --success-soft: #DEEDE2;
    --shadow: rgba(27, 35, 32, 0.08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141715;
      --surface: #1D211E;
      --surface-2: #262B27;
      --border: #343A34;
      --text: #EAEDE9;
      --text-muted: #9BA69E;
      --text-faint: #6E786F;
      --accent: #7BB39D;
      --accent-strong: #9BCBB6;
      --accent-soft: #24322B;
      --in: #7BAAE3;
      --in-soft: #1E2C40;
      --out-farm: #E2A85E;
      --out-farm-soft: #3A2C18;
      --out-ext: #C0AAD6;
      --out-ext-soft: #302A3A;
      --danger: #E58A8A;
      --danger-soft: #3C2323;
      --success: #86CC9F;
      --success-soft: #1F3627;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141715;
    --surface: #1D211E;
    --surface-2: #262B27;
    --border: #343A34;
    --text: #EAEDE9;
    --text-muted: #9BA69E;
    --text-faint: #6E786F;
    --accent: #7BB39D;
    --accent-strong: #9BCBB6;
    --accent-soft: #24322B;
    --in: #7BAAE3;
    --in-soft: #1E2C40;
    --out-farm: #E2A85E;
    --out-farm-soft: #3A2C18;
    --out-ext: #C0AAD6;
    --out-ext-soft: #302A3A;
    --danger: #E58A8A;
    --danger-soft: #3C2323;
    --success: #86CC9F;
    --success-soft: #1F3627;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  input, select, button { font-size: 14px; }

  #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

  /* pin gate */
  .pin-gate {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .pin-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 26px; width: 100%; max-width: 320px; text-align: center;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .pin-box h2 { font-size: 17px; font-weight: 700; color: var(--accent-strong); margin-bottom: 4px; }
  .pin-box p { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }
  .pin-box form { display: flex; gap: 8px; }
  .pin-box input {
    flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 7px; padding: 9px 10px; font-size: 16px; letter-spacing: .1em; text-align: center;
  }
  .pin-error { color: var(--danger); font-size: 12.5px; margin: 10px 0 0 !important; }

  /* header */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 14px 0 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand .farm { font-size: 12px; letter-spacing: .04em; color: var(--text-muted); font-weight: 500; }
  .brand h1 { font-size: 19px; font-weight: 700; color: var(--accent-strong); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
  .tab-btn {
    border: none; background: transparent; color: var(--text-muted);
    padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 600;
    transition: background .15s, color .15s;
  }
  .tab-btn.active { background: var(--surface); color: var(--accent-strong); box-shadow: 0 1px 2px var(--shadow); }
  .sync-pill {
    font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px; background: var(--surface-2);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  .dot.off { background: var(--text-faint); }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .card .label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .card .value { font-size: 24px; font-weight: 600; }
  .card .sub { font-size: 12px; color: var(--text-faint); }

  section.panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 16px;
  }
  section.panel > h2 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  section.panel > .hint { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }

  .field-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .field input, .field select {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 7px; padding: 7px 9px; min-width: 0;
  }
  .field input:focus, .field select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .field.grow { flex: 1 1 160px; }
  .field.num input { width: 100px; }
  .field.date input { width: 148px; }

  .btn {
    border: none; border-radius: 7px; padding: 8px 16px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #fff;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 5px 10px; font-size: 12.5px; }
  .btn.danger-outline:hover { background: var(--danger-soft); }
  .btn.small { padding: 5px 11px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .badge.in { background: var(--in-soft); color: var(--in); }
  .badge.farm { background: var(--out-farm-soft); color: var(--out-farm); }
  .badge.ext { background: var(--out-ext-soft); color: var(--out-ext); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th.left, td.left { text-align: left; }
  thead th { background: var(--surface-2); color: var(--text-muted); font-size: 12px; font-weight: 600; position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .inline-input { width: 64px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 4px 6px; text-align: right; }
  .week-hi { background: var(--accent-soft) !important; }

  .empty { color: var(--text-faint); font-style: italic; padding: 18px; text-align: center; }

  /* calendar */
  .cal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-toolbar .month-label { font-size: 17px; font-weight: 700; min-width: 108px; }
  .cal-scroll { overflow-x: auto; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(76px, 1fr)); min-width: 580px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .cal-dow { background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; font-weight: 600; text-align: center; padding: 6px 0; }
  .cal-day {
    background: var(--surface); border-top: 1px solid var(--border); border-left: 1px solid var(--border);
    min-height: 88px; padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; position: relative;
  }
  .cal-day.outside { background: var(--bg); color: var(--text-faint); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-daynum { font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .cal-chip { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1px 4px; line-height: 1.4; display: block; }
  .cal-chip .fname { font-weight: 500; opacity: .85; }
  .cal-chip.in { background: var(--in-soft); color: var(--in); }
  .cal-chip.farm { background: var(--out-farm-soft); color: var(--out-farm); }
  .cal-chip.ext { background: var(--out-ext-soft); color: var(--out-ext); }
  .cal-chip.more { background: transparent; color: var(--text-faint); font-weight: 500; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12.5px; color: var(--text-muted); align-items: center; }
  .legend .sw { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot2 { width: 9px; height: 9px; border-radius: 3px; }

  .import-box { border: 1px dashed var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 12px; background: var(--surface-2); }
  .import-box .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .import-box .warn-list { font-size: 12.5px; color: var(--text-muted); margin: 8px 0 0; padding-left: 18px; max-height: 120px; overflow-y: auto; }

  .share-mode .topbar .tabs, .share-mode .topbar .sync-pill { display: none !important; }
  .share-mode section.panel.input-only { display: none !important; }
  .share-mode #shareToggle { font-weight: 700; }

  footer.note { font-size: 12px; color: var(--text-faint); text-align: center; padding: 20px 0 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="pinGate" class="pin-gate">
  <div class="pin-box">
    <h2>루카 후기자돈사</h2>
    <p>공유 비밀번호를 입력하세요</p>
    <form id="pinForm">
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="PIN" required>
      <button type="submit" class="btn">입장</button>
    </form>
    <p id="pinError" class="pin-error" style="display:none">비밀번호가 올바르지 않습니다.</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="farm">루카 후기자돈사</span>
      <h1>전입출 현황판</h1>
    </div>
    <div class="tabs" id="tabSwitch" data-action-group="tabs">
      <button class="tab-btn" data-action="setTab" data-tab="dash">입력 · 현황</button>
      <button class="tab-btn" data-action="setTab" data-tab="calendar">전입전출 계획</button>
    </div>
    <span class="sync-pill" id="syncPill"><span class="dot" id="syncDot"></span><span id="syncText">연결 중…</span></span>
  </div>

  <div id="view"></div>

  <footer class="note">주차 기준: 일요일 시작</footer>
</div>

<script type="module">
"use strict";

// ---------- pin gate ----------
(function () {
  var APP_PIN = '9323';
  var PIN_KEY = 'luka_pin_ok_v1';
  var gate = document.getElementById('pinGate');
  if (localStorage.getItem(PIN_KEY) === '1') { gate.style.display = 'none'; return; }
  document.getElementById('pinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var val = document.getElementById('pinInput').value.trim();
    if (val === APP_PIN) {
      try { localStorage.setItem(PIN_KEY, '1'); } catch (e) {}
      gate.style.display = 'none';
    } else {
      document.getElementById('pinError').style.display = 'block';
      document.getElementById('pinInput').value = '';
      document.getElementById('pinInput').focus();
    }
  });
})();

// ---------- firebase (shared storage, no sign-in required) ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot,
  collection, addDoc, getDocs, query, orderBy as fsOrderBy, limit as fsLimit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyD16GVE23OVqodlFHx8h1e0FhWFDz2wLL8",
  authDomain: "luka-piglets.firebaseapp.com",
  projectId: "luka-piglets",
  storageBucket: "luka-piglets.firebasestorage.app",
  messagingSenderId: "895417903466",
  appId: "1:895417903466:web:61e31bdc49d805dbc81d13"
};

var dbAdapter = null;
try {
  var fbApp = initializeApp(firebaseConfig);
  var fsDb = getFirestore(fbApp);

  var wrapDocSnap = function (snap) { return { exists: snap.exists(), data: function () { return snap.data(); } }; };
  var wrapQuerySnap = function (snap) { return { docs: snap.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }) }; };
  var wrapDocRef = function (ref) {
    return {
      id: ref.id,
      get: function () { return getDoc(ref).then(wrapDocSnap); },
      set: function (data) { return setDoc(ref, data); },
      delete: function () { return deleteDoc(ref); },
      onSnapshot: function (next, err) { return onSnapshot(ref, function (s) { next(wrapDocSnap(s)); }, err); }
    };
  };
  var wrapQuery = function (path, q) {
    return {
      doc: function (id) { return wrapDocRef(doc(fsDb, path + '/' + id)); },
      add: function (data) { return addDoc(collection(fsDb, path), data).then(wrapDocRef); },
      orderBy: function (field, dir) { return wrapQuery(path, query(q, fsOrderBy(field, dir || 'asc'))); },
      limit: function (n) { return wrapQuery(path, query(q, fsLimit(n))); },
      get: function () { return getDocs(q).then(wrapQuerySnap); },
      onSnapshot: function (next, err) { return onSnapshot(q, function (s) { next(wrapQuerySnap(s)); }, err); }
    };
  };
  dbAdapter = {
    doc: function (path) { return wrapDocRef(doc(fsDb, path)); },
    collection: function (path) { return wrapQuery(path, collection(fsDb, path)); }
  };
} catch (e) {
  dbAdapter = null;
}

// ---------- app ----------
(function () {
  "use strict";

  // ---------- constants ----------
  var DAY_MS = 86400000;
  var ANCHOR_MS = Date.UTC(2026, 0, 4); // 2026-01-04, Sunday — matches 수급계획 파일 기준일
  var WEEKDAY_KR = ['일','월','화','수','목','금','토'];
  var IN_FARM_NAME = '익산 자돈사';
  var BASE_DATE_ISO = '2026-08-16';
  var BASE_STOCK = 1961;

  function todayMs() {
    var d = new Date();
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parseISO(s) {
    var p = s.split('-').map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]);
  }
  function toISO(ms) {
    var d = new Date(ms);
    var y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, day = d.getUTCDate();
    return y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  }
  function fmtShort(ms) {
    var d = new Date(ms);
    return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일(' + WEEKDAY_KR[d.getUTCDay()] + ')';
  }
  function fmtSlash(ms) {
    var d = new Date(ms);
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + WEEKDAY_KR[d.getUTCDay()] + ')';
  }
  function fmtNum(n) { return (n || 0).toLocaleString('ko-KR'); }

  // ---------- week model (replicates 수급계획 파일의 고정 수식: 시작일 anchor + 7일 반복) ----------
  var weekCache = new Map();
  function computeWeek(idx) {
    if (weekCache.has(idx)) return weekCache.get(idx);
    var startMs = ANCHOR_MS + idx * 7 * DAY_MS;
    var endMs = startMs + 6 * DAY_MS;
    var counts = {};
    for (var i = 0; i < 7; i++) {
      var d = new Date(startMs + i * DAY_MS);
      var key = d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1);
      counts[key] = (counts[key] || 0) + 1;
    }
    var labelKey = null, max = 0;
    for (var k in counts) { if (counts[k] > max) { max = counts[k]; labelKey = k; } }
    var parts = labelKey.split('-').map(Number);
    var ly = parts[0], lm = parts[1];
    var weekNum;
    if (idx <= 0) {
      weekNum = 1;
    } else {
      var prev = computeWeek(idx - 1);
      weekNum = (prev.year === ly && prev.month === lm) ? prev.weekNum + 1 : 1;
    }
    var result = { idx: idx, start: startMs, end: endMs, year: ly, month: lm, weekNum: weekNum,
      label: lm + '월 ' + weekNum + '주' };
    weekCache.set(idx, result);
    return result;
  }
  function weekIndexOf(ms) { return Math.floor((ms - ANCHOR_MS) / (7 * DAY_MS)); }
  function weekOf(ms) { return computeWeek(weekIndexOf(ms)); }

  // ---------- state ----------
  var db = null, useLocal = false;
  var settings = defaultSettings();
  var records = [];
  var activeTab = 'dash';
  var calMonthCursor = (function () { var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
  var shareMode = false;
  var confirmingDeleteId = null;
  var pendingImport = null;
  var importBusy = false;
  var importError = null;

  function defaultSettings() {
    return {
      defaultWeeklyDeath: 20,
      weeklyDeaths: {}
    };
  }

  // ---------- persistence ----------
  var LOCAL_KEY = 'lukapig_v1';
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        settings = Object.assign(defaultSettings(), parsed.settings || {});
        records = parsed.records || [];
      }
    } catch (e) {}
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ settings: settings, records: records })); } catch (e) {}
  }

  function setSyncStatus(mode) {
    var dot = document.getElementById('syncDot');
    var text = document.getElementById('syncText');
    if (!dot) return;
    if (mode === 'live') { dot.className = 'dot'; text.textContent = '실시간 동기화'; }
    else if (mode === 'local') { dot.className = 'dot off'; text.textContent = '이 브라우저에만 저장(공유 불가)'; }
    else { dot.className = 'dot off'; text.textContent = '연결 중…'; }
  }

  async function initStore() {
    db = dbAdapter;
    if (!db) {
      useLocal = true;
      loadLocal();
      setSyncStatus('local');
      render();
      return;
    }
    setSyncStatus('live');
    var settingsRef = db.doc('settings/main');
    settingsRef.onSnapshot(function (snap) {
      if (snap.exists) {
        settings = Object.assign(defaultSettings(), snap.data());
      } else {
        settings = defaultSettings();
        settingsRef.set(settings).catch(function () {});
      }
      render();
    }, function () { setSyncStatus('local'); });

    var recordsRef = db.collection('records').orderBy('date', 'asc').limit(1000);
    recordsRef.onSnapshot(function (snap) {
      records = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function () {});
  }

  async function addRecord(rec) {
    if (db) { await db.collection('records').add(rec); }
    else {
      rec.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      records.push(rec); records.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      saveLocal(); render();
    }
  }
  async function deleteRecord(id) {
    if (db) { await db.doc('records/' + id).delete(); }
    else { records = records.filter(function (r) { return r.id !== id; }); saveLocal(); render(); }
  }
  async function replaceAllRecords(newRecords) {
    if (db) {
      var snap = await db.collection('records').get();
      await Promise.all(snap.docs.map(function (d) { return db.doc('records/' + d.id).delete(); }));
      await Promise.all(newRecords.map(function (r) { return db.collection('records').add(r); }));
    } else {
      records = newRecords.map(function (r, i) {
        return Object.assign({ id: 'local_import_' + Date.now() + '_' + i }, r);
      });
      saveLocal(); render();
    }
  }
  async function saveSettings(patch) {
    settings = Object.assign({}, settings, patch);
    if (db) { await db.doc('settings/main').set(settings); }
    else { saveLocal(); render(); }
  }

  // ---------- ledger / stock math ----------
  function deathForWeek(weekStartISO) {
    var v = settings.weeklyDeaths[weekStartISO];
    return (v === undefined || v === null || v === '') ? settings.defaultWeeklyDeath : Number(v);
  }

  function buildLedger(maxMs) {
    // actual transactions
    var events = records.map(function (r) {
      var delta = r.type === 'in' ? Number(r.head) : -Number(r.head);
      return { date: parseISO(r.date), delta: delta, kind: 'tx', ref: r };
    });
    // synthetic weekly death deductions, from base week through maxMs's week
    var baseMs = parseISO(BASE_DATE_ISO);
    var startIdx = weekIndexOf(baseMs);
    var endIdx = weekIndexOf(maxMs);
    for (var idx = startIdx; idx <= endIdx; idx++) {
      var wk = computeWeek(idx);
      var wkStartISO = toISO(wk.start);
      var death = deathForWeek(wkStartISO);
      if (death) events.push({ date: wk.end, delta: -death, kind: 'death', ref: { week: wk.label } });
    }
    events.sort(function (a, b) {
      if (a.date !== b.date) return a.date - b.date;
      var pa = a.kind === 'death' ? 1 : 0, pb = b.kind === 'death' ? 1 : 0;
      return pa - pb;
    });
    return events;
  }

  function stockAsOf(queryMs) {
    var baseMs = parseISO(BASE_DATE_ISO);
    var horizon = Math.max(queryMs, baseMs, todayMs() + 60 * DAY_MS);
    var ledger = buildLedger(horizon);
    var stock = BASE_STOCK;
    if (queryMs >= baseMs) {
      for (var i = 0; i < ledger.length; i++) {
        if (ledger[i].date >= baseMs && ledger[i].date <= queryMs) stock += ledger[i].delta;
      }
    } else {
      for (var j = 0; j < ledger.length; j++) {
        if (ledger[j].date > queryMs && ledger[j].date < baseMs) stock -= ledger[j].delta;
      }
    }
    return stock;
  }

  function weekAggregate(idx) {
    var wk = computeWeek(idx);
    var inSum = 0, farmSum = 0, extSum = 0;
    records.forEach(function (r) {
      var d = parseISO(r.date);
      if (d < wk.start || d > wk.end) return;
      if (r.type === 'in') inSum += Number(r.head);
      else if (r.subtype === 'farm') farmSum += Number(r.head);
      else if (r.subtype === 'external') extSum += Number(r.head);
    });
    var wkStartISO = toISO(wk.start);
    var death = deathForWeek(wkStartISO);
    var startStock = stockAsOf(wk.start - DAY_MS);
    var endStock = startStock + inSum - farmSum - extSum - death;
    return {
      wk: wk, inSum: inSum, farmSum: farmSum, extSum: extSum, death: death,
      startStock: startStock, endStock: endStock
    };
  }

  function displayWeekRange() {
    var baseMs = parseISO(BASE_DATE_ISO);
    var minMs = baseMs, maxMs = todayMs() + 8 * 7 * DAY_MS;
    records.forEach(function (r) {
      var d = parseISO(r.date);
      if (d < minMs) minMs = d;
      if (d > maxMs) maxMs = d;
    });
    return { from: weekIndexOf(minMs), to: weekIndexOf(maxMs) };
  }

  function renderCalendar() {

    var gridStartIdx = weekIndexOf(firstOfMonth);
    var gridEndIdx = weekIndexOf(lastOfMonth);

    var byDay = {};
    records.forEach(function (r) {
      var d = parseISO(r.date);
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push(r);
    });

      var wk = computeWeek(idx);

  // ---------- excel/csv import (pure browser APIs, no external libraries) ----------
  var TYPE_MAP = { '전입': 'in', '전출': 'out' };
  var SUBTYPE_MAP = { '농장전출': 'farm', '외부판매': 'external' };

  function buildRecordsFromRows(rows) {
    // rows: array of [일자, 구분, 세부구분, 농장명, 두수] starting at index 1 = header
    var out = [], warnings = [];
    for (var r = 2; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.every(function (v) { return v === undefined || v === null || String(v).trim() === ''; })) continue;
      var date = (row[0] == null ? '' : String(row[0])).trim();
      var typeKr = (row[1] == null ? '' : String(row[1])).trim();
      var subtypeKr = (row[2] == null ? '' : String(row[2])).trim();
      var farmName = (row[3] == null ? '' : String(row[3])).trim();
      var head = Number(row[4]);

      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { warnings.push((r) + '행: 일자 형식이 YYYY-MM-DD가 아니어서 건너뜀 ("' + date + '")'); continue; }
      if (!TYPE_MAP[typeKr]) { warnings.push(r + '행: 구분이 "전입"/"전출"이 아니어서 건너뜀 ("' + typeKr + '")'); continue; }
      if (!head || head <= 0) { warnings.push(r + '행: 두수가 없어 건너뜀'); continue; }

      var rec = { date: date, type: TYPE_MAP[typeKr], head: head };
      if (rec.type === 'out') {
        if (!SUBTYPE_MAP[subtypeKr]) { warnings.push(r + '행: 세부구분이 "농장전출"/"외부판매"가 아니어서 건너뜀 ("' + subtypeKr + '")'); continue; }
        rec.subtype = SUBTYPE_MAP[subtypeKr];
        rec.farmName = farmName;
      } else {
        rec.subtype = null;
        rec.farmName = IN_FARM_NAME;
      }
      out.push(rec);
    }
    return { records: out, warnings: warnings };
  }

  function parseCsvText(text) {
    var lines = text.replace(/^﻿/, '').replace(/\r/g, '').split('\n').filter(function (l) { return l.length > 0; });
    // index 0 left empty so rows[1] = header, rows[2] = first data row —
    // matches the 1-based spreadsheet-row indexing buildRecordsFromRows expects for xlsx.
    var rows = [undefined];
    lines.forEach(function (line) {
      var result = [], cur = '', inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (inQuotes) {
          if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
          else cur += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ',') { result.push(cur); cur = ''; }
        else cur += ch;
      }
      result.push(cur);
      rows.push(result);
    });
    return rows;
  }

  async function inflateRawBrowser(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('이 브라우저는 xlsx 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge를 사용하거나 CSV로 저장해 올려주세요.');
    }
    var ds = new DecompressionStream('deflate-raw');
    var writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    var reader = ds.readable.getReader();
    var chunks = [], total = 0;
    for (;;) {
      var res = await reader.read();
      if (res.done) break;
      chunks.push(res.value); total += res.value.length;
    }
    var out = new Uint8Array(total), off = 0;
    chunks.forEach(function (c) { out.set(c, off); off += c.length; });
    return out;
  }

  function findEOCD(bytes) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var maxBack = Math.min(bytes.length, 65557);
    for (var i = bytes.length - 22; i >= bytes.length - maxBack && i >= 0; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) return i;
    }
    throw new Error('올바른 xlsx(zip) 파일이 아닙니다.');
  }

  function parseZipEntries(bytes) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var eocdOff = findEOCD(bytes);
    var cdOffset = dv.getUint32(eocdOff + 16, true);
    var cdSize = dv.getUint32(eocdOff + 12, true);
    var entries = {}, p = cdOffset, end = cdOffset + cdSize;
    var decoder = new TextDecoder('utf-8');
    while (p < end) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var compMethod = dv.getUint16(p + 10, true);
      var compSize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var localHeaderOffset = dv.getUint32(p + 42, true);
      var name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      entries[name] = { compMethod: compMethod, compSize: compSize, localHeaderOffset: localHeaderOffset };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function extractZipEntry(bytes, entry) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var lp = entry.localHeaderOffset;
    if (dv.getUint32(lp, true) !== 0x04034b50) throw new Error('xlsx 파일 구조가 손상되었습니다.');
    var nameLen = dv.getUint16(lp + 26, true);
    var extraLen = dv.getUint16(lp + 28, true);
    var dataStart = lp + 30 + nameLen + extraLen;
    var raw = bytes.subarray(dataStart, dataStart + entry.compSize);
    if (entry.compMethod === 0) return raw;
    if (entry.compMethod === 8) return await inflateRawBrowser(raw);
    throw new Error('지원하지 않는 압축 방식입니다.');
  }

  function colLetterToIndex(ref) {
    var letters = ref.match(/^[A-Z]+/)[0];
    var idx = 0;
    for (var i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
    return idx;
  }

  function parseSharedStrings(xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    var siList = doc.getElementsByTagName('si');
    var arr = [];
    for (var i = 0; i < siList.length; i++) {
      var tNodes = siList[i].getElementsByTagName('t');
      var text = '';
      for (var j = 0; j < tNodes.length; j++) text += tNodes[j].textContent;
      arr.push(text);
    }
    return arr;
  }

  function parseSheetRows(xmlText, sharedStrings) {
    var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    var rowNodes = doc.getElementsByTagName('row');
    var rows = [];
    for (var i = 0; i < rowNodes.length; i++) {
      var rn = rowNodes[i];
      var rowNum = parseInt(rn.getAttribute('r'), 10);
      var cells = rn.getElementsByTagName('c');
      var rowArr = [];
      for (var j = 0; j < cells.length; j++) {
        var c = cells[j];
        var ref = c.getAttribute('r');
        if (!ref) continue;
        var colIdx = colLetterToIndex(ref);
        var type = c.getAttribute('t');
        var value = '';
        if (type === 'inlineStr') {
          var isNode = c.getElementsByTagName('is')[0];
          value = isNode ? isNode.textContent : '';
        } else {
          var vNode = c.getElementsByTagName('v')[0];
          if (vNode) {
            var raw = vNode.textContent;
            value = (type === 's') ? (sharedStrings[parseInt(raw, 10)] || '') : raw;
          }
        }
        rowArr[colIdx - 1] = value;
      }
      rows[rowNum] = rowArr;
    }
    return rows;
  }

  async function resolveSheetPath(buf, entries, sheetName) {
    try {
      var wbBytes = await extractZipEntry(buf, entries['xl/workbook.xml']);
      var wbDoc = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(wbBytes), 'application/xml');
      var sheetNodes = wbDoc.getElementsByTagName('sheet');
      var targetRid = null;
      for (var i = 0; i < sheetNodes.length; i++) {
        if (sheetNodes[i].getAttribute('name') === sheetName) {
          targetRid = sheetNodes[i].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')
            || sheetNodes[i].getAttribute('r:id');
          break;
        }
      }
      if (!targetRid) return null;
      var relsBytes = await extractZipEntry(buf, entries['xl/_rels/workbook.xml.rels']);
      var relsDoc = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(relsBytes), 'application/xml');
      var relNodes = relsDoc.getElementsByTagName('Relationship');
      for (var k = 0; k < relNodes.length; k++) {
        if (relNodes[k].getAttribute('Id') === targetRid) {
          var target = relNodes[k].getAttribute('Target').replace(/^\/?xl\//, '').replace(/^\.?\//, '');
          return 'xl/' + target;
        }
      }
    } catch (e) {}
    return null;
  }

  async function importXlsxFile(file) {
    var buf = new Uint8Array(await file.arrayBuffer());
    var entries = parseZipEntries(buf);
    var sheetPath = await resolveSheetPath(buf, entries, '전입전출입력');
    if (!sheetPath || !entries[sheetPath]) sheetPath = 'xl/worksheets/sheet1.xml';
    if (!entries[sheetPath]) throw new Error('시트를 찾을 수 없습니다. 제공된 양식 파일이 맞는지 확인해 주세요.');

    var sharedStrings = [];
    if (entries['xl/sharedStrings.xml']) {
      var ssBytes = await extractZipEntry(buf, entries['xl/sharedStrings.xml']);
      sharedStrings = parseSharedStrings(new TextDecoder('utf-8').decode(ssBytes));
    }
    var sheetBytes = await extractZipEntry(buf, entries[sheetPath]);
    var rows = parseSheetRows(new TextDecoder('utf-8').decode(sheetBytes), sharedStrings);
    return buildRecordsFromRows(rows);
  }

  function importCsvFile(text) {
    var rows = parseCsvText(text);
    return buildRecordsFromRows(rows);
  }

  async function handleImportFile(file) {
    if (!file) return;
    importError = null;
    importBusy = true;
    pendingImport = null;
    render();
    try {
      var result;
      if (/\.csv$/i.test(file.name)) {
        result = importCsvFile(await file.text());
      } else {
        result = await importXlsxFile(file);
      }
      importBusy = false;
      if (!result.records.length) {
        importError = '가져올 수 있는 행이 없습니다. 예시 행을 지우고 실제 데이터를 입력했는지 확인해 주세요.';
      } else {
        pendingImport = { records: result.records, warnings: result.warnings, fileName: file.name };
      }
    } catch (err) {
      importBusy = false;
      importError = (err && err.message) ? err.message : '파일을 읽는 중 오류가 발생했습니다.';
    }
    render();
  }

  // ---------- event wiring ----------
  var app = document.getElementById('app');

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var action = b.dataset.action;
    if (action === 'setTab') { activeTab = b.dataset.tab; render(); }
    else if (action === 'calPrev') { calMonthCursor.m--; if (calMonthCursor.m < 0) { calMonthCursor.m = 11; calMonthCursor.y--; } render(); }
    else if (action === 'calNext') { calMonthCursor.m++; if (calMonthCursor.m > 11) { calMonthCursor.m = 0; calMonthCursor.y++; } render(); }
    else if (action === 'calToday') { var t = new Date(); calMonthCursor = { y: t.getFullYear(), m: t.getMonth() }; render(); }
    else if (action === 'toggleShare') { shareMode = !shareMode; render(); }
    else if (action === 'askDelete') { confirmingDeleteId = b.dataset.id; render(); }
    else if (action === 'cancelDelete') { confirmingDeleteId = null; render(); }
    else if (action === 'confirmDelete') { var id = b.dataset.id; confirmingDeleteId = null; deleteRecord(id); }
    else if (action === 'triggerImport') { var fi = document.getElementById('importFileInput'); if (fi) fi.click(); }
    else if (action === 'cancelImport') { pendingImport = null; importError = null; render(); }
    else if (action === 'confirmImport') {
      var toApply = pendingImport;
      pendingImport = null; render();
      if (toApply) replaceAllRecords(toApply.records);
    }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'typeSelect') {
      var isOut = t.value === 'out';
      var subtypeSel = document.getElementById('subtypeSelect');
      var farmInput = document.getElementById('farmNameInput');
      subtypeSel.disabled = !isOut;
      farmInput.disabled = !isOut;
      farmInput.placeholder = isOut ? '예: 풍년농장' : '';
      farmInput.value = isOut ? '' : IN_FARM_NAME;
      return;
    }
    if (t.id === 'importFileInput') {
      handleImportFile(t.files && t.files[0]);
      t.value = '';
      return;
    }
    var action = t.dataset.action;
    if (!action) return;
    if (action === 'setDefaultDeath') saveSettings({ defaultWeeklyDeath: Number(t.value) || 0 });
    else if (action === 'setDeath') {
      var wd = Object.assign({}, settings.weeklyDeaths);
      wd[t.dataset.week] = Number(t.value) || 0;
      saveSettings({ weeklyDeaths: wd });
    } else if (action === 'queryStock') { render(); }
  });

  app.addEventListener('submit', function (e) {
    if (e.target.id !== 'recordForm') return;
    e.preventDefault();
    var f = new FormData(e.target);
    var type = f.get('type');
    var head = Number(f.get('head'));
    if (!head || head <= 0) return;
    var rec = {
      date: f.get('date'),
      type: type,
      subtype: type === 'out' ? f.get('subtype') : null,
      farmName: type === 'out' ? (f.get('farmName') || '').trim() : IN_FARM_NAME,
      head: head
    };
    addRecord(rec);
    e.target.reset();
    document.querySelector('#recordForm [name="date"]').value = toISO(todayMs());
    document.getElementById('subtypeSelect').disabled = true;
    document.getElementById('farmNameInput').value = IN_FARM_NAME;
    document.getElementById('farmNameInput').disabled = true;
  });

  render();
  initStore();
})();
</script>
</body>
</html>
